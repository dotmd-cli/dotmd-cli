[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotmd"
version = "0.1.0"
authors = [
  { name = "dotmd contributors" }
]
description = "A CLI for the dotmd.io AI rule registry."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer[all]>=0.12.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
dotmd = "dotmd.cli:run"

[project.urls]
Homepage = "https://mydotmd.io"
Repository = "https://github.com/dotmd/dotmd-cli"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
