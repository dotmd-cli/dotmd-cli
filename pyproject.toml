[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotmd"
version = "0.1.0"
authors = [
  { name = "dotmd contributors" }
]
description = "CLI for the mydotmd.io AI rule registry — fetch and share .md instruction files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
  "dotmd", "ai", "llm", "cursor", "claude", "copilot", "windsurf",
  "rules", "instructions", "registry", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "typer[all]>=0.12.0",
  "requests>=2.31.0",
  "pyfiglet>=1.0.2",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
dotmd = "dotmd.cli:run"

[project.urls]
Homepage = "https://mydotmd.io"
Repository = "https://github.com/dotmd/dotmd-cli"
"Bug Tracker" = "https://github.com/dotmd/dotmd-cli/issues"
Changelog = "https://github.com/dotmd/dotmd-cli/releases"

[tool.setuptools.package-data]
dotmd = ["mascot.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
